#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - ufw
  - wireguard

write_files:
  - path: /etc/sysctl.d/99-personal-platform.conf
    permissions: "0644"
    content: |
      net.ipv4.ip_forward=1

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo ${UBUNTU_CODENAME:-$VERSION_CODENAME}) stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - install -m 0700 -d /etc/wireguard
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow in on wg0 to any port 22 proto tcp
  - ufw allow in on wg0 to any port 80 proto tcp
  - ufw allow in on wg0 to any port 443 proto tcp
  - ufw --force enable
  - mkdir -p /opt/personal-platform /srv/apps /srv/data
